[project]
name = "appdeveloper"
version = "0.1.0"
description = "appdeveloper using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]>=1.15.1,<2.0.0",
]

[project.scripts]
appdeveloper = "appdeveloper.main:run"
run_crew = "appdeveloper.main:run"
train = "appdeveloper.main:train"
replay = "appdeveloper.main:replay"
test = "appdeveloper.main:test"
run_with_trigger = "appdeveloper.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "a524062e-eadf-4bb6-972f-0e503acba2b6"
